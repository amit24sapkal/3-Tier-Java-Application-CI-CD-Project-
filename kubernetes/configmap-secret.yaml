apiVersion: v1
kind: ConfigMap
metadata:
  name: ekart-config
  namespace: default
  labels:
    app: ekart
data:
  database-url: "jdbc:mysql://mysql-service:3306/ekart_db"
  application-name: "Ekart Application"
  log-level: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: ekart-secrets
  namespace: default
  labels:
    app: ekart
type: Opaque
stringData:
  db-username: ekart_user
  db-password: ekart_pass
