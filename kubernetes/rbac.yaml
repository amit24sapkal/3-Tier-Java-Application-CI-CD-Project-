apiVersion: v1
kind: ServiceAccount
metadata:
  name: ekart-sa
  namespace: default
  labels:
    app: ekart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ekart-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods", "pods/logs"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ekart-rolebinding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ekart-role
subjects:
- kind: ServiceAccount
  name: ekart-sa
  namespace: default
